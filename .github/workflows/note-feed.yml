# noteの新しい記事を、サイトの「記事」一覧に自動で反映する
name: note記事の取り込み
on:
  schedule:
    - cron: "17 */3 * * *"   # 3時間ごと（UTC）
  workflow_dispatch: {}      # Actions の画面から手動でも実行できる
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/note_feed.py
      - name: 変更があればコミット
        run: |
          if [ -n "$(git status --porcelain js/note-feed.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/note-feed.js
            git commit -m "noteの記事一覧を更新"
            git push
          fi
